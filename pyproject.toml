[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwork-lens"
version = "1.0.0"
description = "Self-hosted web view for GroundWork projects on GitHub and GitLab."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1",
    "cryptography>=41.0",
    "PyJWT>=2.8",
    "requests>=2.31",
    "markdown-it-py>=3.0",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
prod = [
    "Pillow>=10.0",
    "gunicorn>=21.2",
]

[project.scripts]
groundwork-lens = "lens.__main__:main"

[tool.setuptools.packages.find]
include = ["lens*", "engine*"]
